name: Check and deploy Dubas

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dubas-workflow-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
  NEXT_PUBLIC_INQUIRY_ENDPOINT: ${{ vars.INQUIRY_ENDPOINT }}
  NEXT_PUBLIC_TELEGRAM_URL: ${{ vars.TELEGRAM_URL }}
  NEXT_PUBLIC_PROVIDER_NAME: ${{ vars.PROVIDER_NAME }}
  NEXT_PUBLIC_PROVIDER_TAX_ID: ${{ vars.PROVIDER_TAX_ID }}
  SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE || 'false' }}
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
  WRANGLER_SEND_METRICS: 'false'

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build and verify static website
        shell: bash
        env:
          PRODUCTION_ENABLED: ${{ vars.PRODUCTION_ENABLED }}
        run: |
          if [[ "$GITHUB_REF" == 'refs/heads/main' && "$PRODUCTION_ENABLED" == 'true' ]]; then
            npm run build:production
          else
            npm run build:ci
          fi
      - run: npm run typecheck
      - run: npm run worker:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-site
          path: out/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: dubas-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-site
          path: out/
      - name: Configure production and check credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node scripts/configure-deployment.mjs
          node scripts/prepare-firebase-auth.mjs
      - name: Apply compatible D1 migrations
        run: npx --no-install wrangler d1 migrations apply DB --remote --config worker/wrangler.production.json
      - name: Deploy enquiry API
        run: npx --no-install wrangler deploy --config worker/wrangler.production.json
      - name: Check deployed API revision
        run: node scripts/smoke-production.mjs --api-only
      - name: Verify downloaded website artifact
        run: node scripts/check-production-artifact.mjs
      - name: Deploy Firebase Hosting
        run: npx --no-install firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --config .deployment/firebase.json --non-interactive
      - name: Check published website
        run: node scripts/smoke-production.mjs
      - name: Deployment summary
        if: success()
        shell: bash
        run: |
          printf 'Published: %s\n\nCommit: `%s`\n' "$NEXT_PUBLIC_SITE_URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary credentials
        if: always()
        run: node scripts/prepare-firebase-auth.mjs --cleanup
